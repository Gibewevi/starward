<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101319;color:#d5d4d3;font:14px system-ui,sans-serif;display:grid;place-content:center;padding:34px 20px}main{max-width:1000px}h1{font-size:22px;font-weight:500;letter-spacing:.05em;margin:0 0 12px}p{color:#89909a;font-size:12px;margin:0 0 28px;line-height:1.6}.figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}figure{margin:0}figcaption{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}.portrait{width:240px;height:320px;overflow:hidden;background:#0b0d11;position:relative;border:1px solid #242832}.portrait img{position:absolute;max-width:none;image-rendering:pixelated}.reference img{width:1708.5px;height:399px;left:-62px;top:-36px}.before img{width:980px;height:1555px;left:-373px;top:-611px}.after img{width:980px;height:1555px;left:-373px;top:-611px}.note{margin:14px 0 0;max-width:240px;color:#8e949f;line-height:1.6;font-size:11px}a{color:#abc7ea;text-decoration:none;display:inline-block;margin-top:28px;font-size:12px}@media(max-width:790px){.figures{gap:10px}.portrait{width:220px;height:320px}.reference img{left:-72px}.before img,.after img{left:-383px}}@media(max-width:700px){.figures{grid-template-columns:1fr;justify-items:center}h1,p{text-align:center}figure{margin-bottom:20px}}

<main>
  <h1>STARWARD / Étude du personnage</h1>
  <p>Référence et captures du jeu ramenées à une même hauteur apparente. La lumière et la pose diffèrent.</p>
  <div class="figures">
    <figure><figcaption>Référence fournie</figcaption><div class="portrait reference"><img src="/review/reference.png" alt="Jedi de la référence : silhouette fine et longs pans de veste"></div><p class="note">Taille fine, manches souples, cheveux sombres et chaussures discrètes.</p></figure>
    <figure><figcaption>Version précédente</figcaption><div class="portrait before"><img src="/review/avant.jpg" alt="Ancien personnage plus massif"></div><p class="note">Buste épais, revers rigides et bouts de bottes trop volumineux.</p></figure>
    <figure><figcaption>Version retravaillée</figcaption><div class="portrait after"><img src="/review/apres.jpg" alt="Personnage retravaillé dans le jeu"></div><p class="note">Volumes affinés, formes continues, vêtements plus fins et palette resserrée.</p></figure>
  </div>
